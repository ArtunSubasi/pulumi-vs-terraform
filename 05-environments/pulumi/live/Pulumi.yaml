name: environments
description: 05 - Environments
runtime:
  name: nodejs
  options:
    packagemanager: npm
# State lives next to the code, like terraform.tfstate (local file backend).
backend:
  url: file://./.pulumi-state
packages:
  local:
    source: terraform-provider
    version: 1.5.0
    parameters:
      - hashicorp/local
      - 2.9.1
# Typed config schema: every stack is validated against it before the program runs.
config:
  instanceCount:
    type: integer
  logLevel:
    type: string
    default: info
