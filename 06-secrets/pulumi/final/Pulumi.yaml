name: secrets
description: 06 - Secrets
runtime:
  name: nodejs
  options:
    packagemanager: npm
# State lives next to the code, like terraform.tfstate (local file backend).
backend:
  url: file://./.pulumi-state
packages:
  local:
    source: terraform-provider
    version: 1.5.0
    parameters:
      - hashicorp/local
      - 2.9.1
config:
  apiToken:
    type: string
    secret: true   # a plaintext value fails validation before the program runs
